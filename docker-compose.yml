services:
  danish-job-market-analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: danish_job_market_analytics
    ports:
      - "3000:3000"
    environment:
      - AI_MODE=mock
      - DB_PATH=/app/data/processed/danish_jobs.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # ── Cloudflare Tunnel ────────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cf-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    deploy:
      resources:
        limits:
          memory: 64M
    environment:
      - TUNNEL_TOKEN=eyJhIjoiNzBmMmYzYTAwY2I3M2ZkYzVlZGZkN2EyODc5NzMwMmIiLCJ0IjoiYzQ0ZWYxNDgtNDJmNC00MDA5LWJhZDUtNzQyMGRkOWI4NzI1IiwicyI6Ik9ESXdNVGRtWWpNdFpqWmpOeTAwWkdVMExXRXhZamN0TWpreE56Z3dNemhoTlRneiJ9
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
