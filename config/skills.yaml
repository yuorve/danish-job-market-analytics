# Danish Job Market Analytics - Skills Catalog Configuration
categories:
  Programming:
    - name: "Python"
      pattern: "\\bpython\\b|\\bpy3?\\b"
    - name: "Java"
      pattern: "\\bjava\\b(?!script)"
    - name: "JavaScript"
      pattern: "\\bjavascript\\b|\\bjs\\b"
    - name: "TypeScript"
      pattern: "\\btypescript\\b|\\bts\\b"
    - name: "C#"
      pattern: "\\bc#\\b|\\bcsharp\\b"
    - name: "C++"
      pattern: "\\bc\\+\\+\\b|\\bcpp\\b"
    - name: "C"
      pattern: "\\bc\\s+language\\b|\\bansi c\\b"
    - name: "Go"
      pattern: "\\bgolang\\b|\\bgo\\s+programming\\b"
    - name: "Rust"
      pattern: "\\brust\\b"
    - name: "PHP"
      pattern: "\\bphp\\b"
    - name: "Kotlin"
      pattern: "\\bkotlin\\b"
    - name: "Swift"
      pattern: "\\bswift\\b"
    - name: "Dart"
      pattern: "\\bdart\\b"
    - name: "R"
      pattern: "\\br\\s+programming\\b|\\br\\s+language\\b"
    - name: "Scala"
      pattern: "\\bscala\\b"
    - name: "Bash"
      pattern: "\\bbash\\b|\\bshell\\s+scripting\\b"

  Data:
    - name: "SQL"
      pattern: "\\bsql\\b|\\bt-sql\\b|\\bpl/sql\\b"
    - name: "Pandas"
      pattern: "\\bpandas\\b"
    - name: "Apache Spark"
      pattern: "\\bspark\\b|\\bpyspark\\b|\\bapache\\s+spark\\b"
    - name: "Databricks"
      pattern: "\\bdatabricks\\b"
    - name: "Microsoft Fabric"
      pattern: "\\bmicrosoft\\s+fabric\\b|\\bms\\s+fabric\\b|\\bfabric\\b"
    - name: "Power BI"
      pattern: "\\bpower\\s*bi\\b|\\bpbi\\b"
    - name: "Snowflake"
      pattern: "\\bsnowflake\\b"
    - name: "Apache Airflow"
      pattern: "\\bairflow\\b"
    - name: "dbt"
      pattern: "\\bdbt\\b|\\bdata\\s+build\\s+tool\\b"
    - name: "Delta Lake"
      pattern: "\\bdelta\\s+lake\\b"
    - name: "Kafka"
      pattern: "\\bkafka\\b"
    - name: "PostgreSQL"
      pattern: "\\bpostgres\\b|\\bpostgresql\\b"
    - name: "Tableau"
      pattern: "\\btableau\\b"

  Cloud:
    - name: "Azure"
      pattern: "\\bazure\\b"
    - name: "AWS"
      pattern: "\\baws\\b|\\bamazon\\s+web\\s+services\\b"
    - name: "GCP"
      pattern: "\\bgcp\\b|\\bgoogle\\s+cloud\\b"
    - name: "Docker"
      pattern: "\\bdocker\\b"
    - name: "Kubernetes"
      pattern: "\\bkubernetes\\b|\\bk8s\\b"
    - name: "Terraform"
      pattern: "\\bterraform\\b"
    - name: "Linux"
      pattern: "\\blinux\\b"
    - name: "CI/CD"
      pattern: "\\bci/cd\\b|\\bgithub\\s+actions\\b"

  AI:
    - name: "Machine Learning"
      pattern: "\\bmachine\\s+learning\\b|\\bml\\b"
    - name: "Deep Learning"
      pattern: "\\bdeep\\s+learning\\b"
    - name: "LLM"
      pattern: "\\bllm[s]?\\b|\\blarge\\s+language\\s+model[s]?\\b"
    - name: "Generative AI"
      pattern: "\\bgenerative\\s+ai\\b|\\bgenai\\b"
    - name: "OpenAI"
      pattern: "\\bopenai\\b|\\bgpt-?4\\b"
    - name: "Azure OpenAI"
      pattern: "\\bazure\\s+openai\\b"
    - name: "LangChain"
      pattern: "\\blangchain\\b"
    - name: "RAG"
      pattern: "\\brag\\b|\\bretrieval\\s+augmented\\s+generation\\b"
    - name: "Computer Vision"
      pattern: "\\bcomputer\\s+vision\\b"
    - name: "NLP"
      pattern: "\\bnlp\\b|\\bnatural\\s+language\\s+processing\\b"
    - name: "PyTorch"
      pattern: "\\bpytorch\\b"
    - name: "TensorFlow"
      pattern: "\\btensorflow\\b"

  Development:
    - name: "React"
      pattern: "\\breact(?:\\.js)?\\b"
    - name: "Node.js"
      pattern: "\\bnode(?:\\.js)?\\b"
    - name: ".NET"
      pattern: "\\b\\.net\\b|\\bdotnet\\b|\\basp\\.net\\b"
    - name: "Spring"
      pattern: "\\bspring\\s*boot\\b"
    - name: "FastAPI"
      pattern: "\\bfastapi\\b"
    - name: "Django"
      pattern: "\\bdjango\\b"
    - name: "Flutter"
      pattern: "\\bflutter\\b"
    - name: "REST API"
      pattern: "\\brest\\s*api[s]?\\b|\\brestful\\b"
